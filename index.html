<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101922" />
    <meta
      name="description"
      content="A tiny handmade world. Two very serious moths. One irresistible light."
    />
    <title>Moth Fight Club</title>
  </head>
  <body>
    <main class="diorama">
      <div id="game"></div>
      <header>
        <p class="eyebrow"><span></span> A light in the dark</p>
        <h1>Moth<br />Fight Club<span class="period">.</span></h1>
        <p class="subtitle">Tiny wings. Big grudges.</p>
      </header>
      <aside class="edition">
        THE BEDROOM BOUT<span>01 / MINIATURE WORLD</span>
      </aside>
      <div class="bottom-panel">
        <div class="caption">
          <span class="tag">Meet the contenders</span>
          <p id="status" role="status">Warming up the light…</p>
          <p class="hint">Drag to look around · Scroll to get closer</p>
        </div>
        <div class="actions">
          <button id="nudge" type="button" disabled>
            Nudge the lamp <span aria-hidden="true">↗</span>
          </button>
          <button id="camera" type="button" class="secondary" disabled>
            Reset view
          </button>
          <button id="reset" type="button" class="secondary" disabled>
            Reset scene
          </button>
        </div>
      </div>
      <footer>
        <span>Felt, fury &amp; questionable decisions.</span
        ><span>3D scene study · Match play coming next</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
